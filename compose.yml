services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legalcaseflow
      POSTGRES_USER: legalcaseflow
      POSTGRES_PASSWORD: legalcaseflow
    ports:
      - "5432:5432"
    volumes:
      - legalcaseflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalcaseflow -d legalcaseflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"

volumes:
  legalcaseflow_postgres:
