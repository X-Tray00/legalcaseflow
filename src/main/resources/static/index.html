<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalCaseFlow</title>
    <link rel="stylesheet" href="/styles.css?v=20260607-3">
</head>
<body>

<!-- LOGIN -->
<div id="login-view" class="login-view">
    <div class="login-stage">
        <div class="login-brand">
            <div class="emblem">⚖</div>
            <div class="wordmark">LegalCaseFlow</div>
            <div class="tagline">Кантората ви на едно място.</div>
        </div>
        <form id="login-form" class="login-card">
            <h2>Вход в системата</h2>
            <label>Потребител
                <input id="login-username" type="text" autocomplete="username" required>
            </label>
            <label>Парола
                <input id="login-password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="btn-gold block">Влез</button>
            <p id="login-error" class="error-text"></p>
            <p class="muted demo">admin / admin123 · ivanov / lawyer123 · maria / client123</p>
        </form>
    </div>
</div>

<!-- APP -->
<div id="app-view" class="app-view hidden">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark">⚖</span>
            <span class="brand-name">LegalCaseFlow</span>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-foot">
            <div id="user-label" class="user-label"></div>
            <button id="logout-btn" class="ghost block">Изход</button>
        </div>
    </aside>
    <div class="main">
        <main id="content" class="content"></main>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js?v=20260607-3"></script>
</body>
</html>
